<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Essai PNG et zip</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    html, body { height: auto; overflow: auto; }
    body { padding: 16px; }
    #results figure { margin: 0 0 24px; }
    #results .pair { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; }
    #results img, #results .real { flex: none; border: 1px solid #555; }
    #results .real { position: relative; overflow: hidden; }
    #results .real .ui-screen { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
    button { min-height: 44px; margin: 4px 8px 12px 0; }
    #log { white-space: pre-line; }
  </style>
</head>
<body>
  <h1>Essai : images PNG et zip</h1>
  <p>À gauche le vrai rendu, à droite le PNG. Les deux doivent être pareils. Touche ensuite « Partager le zip ».</p>
  <button id="share" disabled>Partager le zip</button>
  <p id="log">Calcul…</p>
  <div id="results"></div>
  <script type="module">
    import { createElement } from './src/utils/dom.js';
    import { createZip } from './src/utils/zip.js';
    import { createEmptyDocument } from './src/model/document.js';
    import { buildTemplate, TEMPLATE_CATEGORIES } from './src/model/templates.js';
    import { renderScreen } from './src/render/screenRenderer.js';
    import { loadIconLibrary } from './src/render/iconLibrary.js';
    import { renderScreenPng } from './src/io/screenImage.js';

    const PREVIEW_WIDTH = 480;
    const logElement = document.getElementById('log');
    const addLog = (text) => { logElement.textContent += `\n${text}`; };

    /** Fabrique tous les écrans types en PNG, puis un zip. */
    async function runTest() {
      await loadIconLibrary().catch(() => null);
      logElement.textContent = navigator.userAgent;
      const uiDocument = createEmptyDocument();
      const templates = TEMPLATE_CATEGORIES.find((category) => category.key === 'screen').templates;
      uiDocument.screens = Object.keys(templates).flatMap((templateKey) => buildTemplate(uiDocument, 'screen', templateKey).createdNode);
      const files = [];
      const startTime = performance.now();
      for (const screen of uiDocument.screens) {
        try {
          const pngBlob = await renderScreenPng(uiDocument, screen, uiDocument.project.defaultTheme);
          files.push({ path: `screens/${screen.id}.png`, content: pngBlob });
          const previewScale = PREVIEW_WIDTH / screen.size.width;
          const realScreen = renderScreen(uiDocument, screen, { themeId: uiDocument.project.defaultTheme, isEditor: false });
          realScreen.style.transform = `scale(${previewScale})`;
          document.getElementById('results').append(createElement('figure', {}, [
            createElement('figcaption', { text: `${screen.id} ${screen.name} — ${Math.round(pngBlob.size / 1024)} Ko` }),
            createElement('div', { className: 'pair' }, [
              createElement('div', { className: 'real', style: { width: `${PREVIEW_WIDTH}px`, height: `${screen.size.height * previewScale}px` } }, [realScreen]),
              createElement('img', { attributes: { src: URL.createObjectURL(pngBlob), width: PREVIEW_WIDTH, alt: screen.name } }),
            ])]));
        } catch (error) {
          console.error(error);
          addLog(`ÉCHEC ${screen.id} : ${error.name} ${error.message}`);
        }
      }
      addLog(`${files.length} / ${uiDocument.screens.length} images en ${Math.round(performance.now() - startTime)} ms`);
      const zipBlob = await createZip([{ path: 'ui.json', content: JSON.stringify(uiDocument) }, ...files]);
      const zipFile = new File([zipBlob], 'Essai_uispec.zip', { type: 'application/zip' });
      addLog(`Zip : ${Math.round(zipBlob.size / 1024)} Ko ; partage du zip possible : ${navigator.canShare?.({ files: [zipFile] }) ? 'oui' : 'non'}`);
      const shareButton = document.getElementById('share');
      shareButton.disabled = false;
      shareButton.addEventListener('click', async () => {
        try {
          if (navigator.maxTouchPoints > 1 && navigator.canShare?.({ files: [zipFile] })) { await navigator.share({ files: [zipFile] }); addLog('Partage : fait'); return; }
          const downloadLink = createElement('a', { attributes: { href: URL.createObjectURL(zipBlob), download: zipFile.name } });
          downloadLink.click();
          addLog('Téléchargement : demandé');
        } catch (error) {
          addLog(`Partage : ${error.name} ${error.message}`);
        }
      });
    }
    runTest().catch((error) => addLog(`ÉCHEC : ${error.message}`));
  </script>
</body>
</html>
